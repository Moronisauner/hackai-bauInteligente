[env]
# Conexão com o Postgres da POC (vide infra/docker-compose.yml).
DATABASE_URL = "postgres://hackai:hackai@localhost:5432/hackai?sslmode=disable"
# Data de referência da POC — TODA regra temporal usa esta data (PRD §8). Formato YYYY-MM-DD.
POC_REFERENCE_DATE = "2025-01-01"
# Porta HTTP do servidor (opcional, default :8080).
HTTP_PORT = ":8080"

[tools]
go = "latest"
# Runtime do frontend (SPA Vite + React + TS, vide frontend/).
node = "lts"
# Gerador de docs OpenAPI a partir das annotations (vide tarefa swagger abaixo).
"go:github.com/swaggo/swag/cmd/swag" = "v1.16.4"

[tasks.api]
description = "Sobe a API HTTP (entrypoint backend/cmd/api/main.go)"
run = "go run ./cmd/api"
dir = "{{ config_root }}/backend"

[tasks.swagger]
description = "Regera backend/docs/swagger.{json,yaml} a partir das annotations"
run = "cd backend && swag init --generalInfo cmd/api/main.go --output docs --parseDependency --parseInternal"

[tasks.web]
description = "Sobe o frontend (Vite dev server, proxy /api → :8080)"
run = "npm run dev"
dir = "{{ config_root }}/frontend"

[tasks.api-test]
description = "Roda os testes do backend Go (go test ./...)"
run = "go test ./..."
dir = "{{ config_root }}/backend"

[tasks.db-up]
description = "Sobe o Postgres via docker compose, em background, e espera ficar healthy"
run = "docker compose -f infra/docker-compose.yml up -d --wait"
dir = "{{ config_root }}"

[tasks.db-down]
description = "Para o Postgres (mantém o volume com os dados)"
run = "docker compose -f infra/docker-compose.yml down"
dir = "{{ config_root }}"

[tasks.db-reset]
description = "Apaga o volume e recarrega a massa do zero (down -v && up --wait)"
run = "docker compose -f infra/docker-compose.yml down -v && docker compose -f infra/docker-compose.yml up -d --wait"
dir = "{{ config_root }}"

[tasks.db-cleanup]
description = "Mantém só um cliente e apaga o resto da massa (manual). Override: KEEP_USER_ID=<hash> mise run db-cleanup"
dir = "{{ config_root }}"
env = { KEEP_USER_ID = "695a8cddb2c3fcf4d0536663f8cfca8f4d147f14d1af5e4835c2aeb82b80ce84" }
run = """
docker compose -f infra/docker-compose.yml exec -T postgres \
  psql -U hackai -d hackai -v ON_ERROR_STOP=1 -v keep_user_id="$KEEP_USER_ID" \
  < infra/cleanup.sql
"""

[tasks.up]
description = "Stack completo: db-up (docker -d) + backend (:8080) + frontend (:5173). Ctrl+C derruba os servers."
depends = ["db-up"]
dir = "{{ config_root }}"
run = """
set -e
mise run api &
api_pid=$!
mise run web &
web_pid=$!
# Ao receber Ctrl+C, encerra os dois servers (a infra continua de pé).
trap 'kill $api_pid $web_pid 2>/dev/null' INT TERM
wait
"""
