basePath: /
definitions:
  internal_httpapi.AccountDTO:
    properties:
      account_id:
        type: string
      balance:
        example: "1234.56"
        type: string
      balance_reference_date:
        example: "2025-01-01"
        type: string
      branch_code:
        type: string
      brand_name:
        type: string
      check_digit:
        type: string
      compe_code:
        type: string
      number:
        type: string
      type:
        type: string
    type: object
  internal_httpapi.AllocationRequest:
    properties:
      account_id:
        type: string
      percentage:
        example: 50
        type: integer
    type: object
  internal_httpapi.BacktestMovementDTO:
    properties:
      account_id:
        type: string
      amount:
        example: "500.00"
        type: string
      reference_month:
        example: "2025-06-01"
        type: string
      status:
        type: string
    type: object
  internal_httpapi.BacktestResultDTO:
    properties:
      movements:
        items:
          $ref: '#/definitions/internal_httpapi.BacktestMovementDTO'
        type: array
      summary:
        $ref: '#/definitions/internal_httpapi.BacktestSummaryDTO'
      vault_evolution:
        items:
          $ref: '#/definitions/internal_httpapi.VaultEvolutionDTO'
        type: array
    type: object
  internal_httpapi.BacktestSummaryDTO:
    properties:
      completed_count:
        type: integer
      completed_months_pct:
        example: 0.83
        type: number
      failed_count:
        type: integer
      goal_reached:
        type: boolean
      target_amount:
        example: "10000.00"
        type: string
      vault_balance:
        example: "8400.00"
        type: string
      worst_account_id:
        type: string
    type: object
  internal_httpapi.ConfigDTO:
    properties:
      poc_reference_date:
        example: "2025-01-01"
        type: string
    type: object
  internal_httpapi.CreateGoalRequest:
    properties:
      allocations:
        items:
          $ref: '#/definitions/internal_httpapi.AllocationRequest'
        type: array
      duration_months:
        example: 12
        type: integer
      name:
        example: Viagem
        type: string
      start_date:
        example: "2025-01-01"
        type: string
      target_amount:
        example: "10000.00"
        type: string
      withdrawal_day:
        example: 5
        type: integer
    type: object
  internal_httpapi.CreateGoalResponse:
    properties:
      goal_id:
        type: string
      vault_id:
        type: string
    type: object
  internal_httpapi.GoalAllocationDTO:
    properties:
      account_id:
        type: string
      brand_name:
        type: string
      monthly_amount:
        example: "416.67"
        type: string
      number:
        type: string
      percentage:
        type: integer
      type:
        type: string
    type: object
  internal_httpapi.GoalDTO:
    properties:
      allocations:
        items:
          $ref: '#/definitions/internal_httpapi.GoalAllocationDTO'
        type: array
      duration_months:
        type: integer
      goal_id:
        type: string
      name:
        type: string
      start_date:
        type: string
      target_amount:
        type: string
      user_id:
        type: string
      vault_id:
        type: string
      withdrawal_day:
        type: integer
    type: object
  internal_httpapi.GoalSummaryDTO:
    properties:
      duration_months:
        type: integer
      goal_id:
        type: string
      name:
        type: string
      start_date:
        type: string
      target_amount:
        type: string
      withdrawal_day:
        type: integer
    type: object
  internal_httpapi.UserDTO:
    properties:
      accounts_count:
        type: integer
      nome:
        type: string
      user_id:
        type: string
    type: object
  internal_httpapi.VaultEvolutionDTO:
    properties:
      balance:
        example: "1000.00"
        type: string
      month:
        example: "2025-06-01"
        type: string
    type: object
info:
  contact: {}
  description: Backend da POC do centralizador de saldo. Toda regra temporal usa POC_REFERENCE_DATE.
  title: Centralizador de Saldo (POC) — API
  version: "0.1"
paths:
  /config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpapi.ConfigDTO'
      summary: Configuração pública da POC
      tags:
      - infra
  /goals/{goalID}:
    get:
      parameters:
      - description: ID do objetivo
        in: path
        name: goalID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpapi.GoalDTO'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Detalhe de um objetivo
      tags:
      - goals
  /goals/{goalID}/backtest:
    get:
      parameters:
      - description: ID do objetivo
        in: path
        name: goalID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpapi.BacktestResultDTO'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Consulta o resultado do backtest
      tags:
      - backtest
    post:
      parameters:
      - description: ID do objetivo
        in: path
        name: goalID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpapi.BacktestResultDTO'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Executa o backtest de um objetivo
      tags:
      - backtest
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - infra
  /users:
    get:
      parameters:
      - description: Filtro por substring do nome
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_httpapi.UserDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista clientes
      tags:
      - users
  /users/{userID}/accounts:
    get:
      parameters:
      - description: ID do cliente
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_httpapi.AccountDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista contas de um cliente com saldo
      tags:
      - users
  /users/{userID}/goals:
    get:
      parameters:
      - description: ID do cliente
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_httpapi.GoalSummaryDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista objetivos de um cliente
      tags:
      - goals
    post:
      consumes:
      - application/json
      parameters:
      - description: ID do cliente
        in: path
        name: userID
        required: true
        type: string
      - description: Dados do objetivo
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.CreateGoalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_httpapi.CreateGoalResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria um objetivo (goal + vault + allocations)
      tags:
      - goals
swagger: "2.0"
